ozet: |
  120 newschool’dur. Seviye 120’de biter. Tecrübe birikir, seviye artmaz. 99 ve 105 içeriği açık kalır. Kasılma 105’ten akıcıdır. Oran profil dosyasında, sayı henüz yok. 120 çarpanı 105’ten yüksektir.
  Efsun yedidir. Altıncı ve yedinci yuva, beş efsun dolu eşyaya basılır.
  Simya açıktır. Taşlar elmas, yakut, yeşim, safir, grena ve onikstir. Tavan mitsi kusursuzdur. Pencere, basım ve set bu profilde açılır.
  Kemer, kostüm, enerji ve mühürlü pet 105’ten açıktır. Omuz kuşağı, aura, tılsım ve levelli pet açıktır.
  Gaya, yansıtma, otomatik av ve yardımcı şaman açıktır. Gaya yang’ın yerine geçmez.
  Kyanit PvP çizgisidir. Zodyak PvM çizgisidir. 75’lik ve beta silahlar durur, giyilir.
  Savaşçı ve ninja altıncı beceriyi alır. Beceri tavanı Perfect’tir. Küp, çevrimdışı pazar, efsun botu ve ek envanter açıktır.
  90’a kadar klasik saha ve sürgün durur. 90’dan 105’e dört beta saha durur. 105’ten 120’ye açık saha Büyülü Orman’dır. Bant 100–120’dir ve her oyuncu kanalındadır.
  Ochao 95–110’dur ve oyuncu kanal listesinde durmaz. Seviye yolu değildir.
  Jotun, Meley, Hidra ve Zodyak oyuncu kanal listesinde durmaz. Hidra bitince kıta açılmaz. Zodyak nişanı PvM silah ve zırhına gider.
  Büyülü Orman, Ochao, Jotun, Meley, Hidra ve Zodyak harita numarası pack satırındandır. Uyanış, klasör doluysa açılır. İllüzyon platosu, klasör doluysa açılır. Boş klasör sayfa açmaz.
  Biyolog omurgası 94’e kadardır. 95–120 satırı, o seviyenin görev dosyası duruyorsa bu profilde görünür.
  Başlangıç seviyesi seçilmedi. Başlangıçta efsunlu set, yardımcı şaman, binek, pet ve yüzük vardır.
  15. seviyenin altındaki oyuncu PvP hedefi olamaz.
